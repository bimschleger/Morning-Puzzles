; PlatformIO Project Configuration File
; Morning Puzzles - ESP32 80mm Thermal Receipt Printer Client

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -I include

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
